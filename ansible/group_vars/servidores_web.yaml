vhost_nombre: www.gabrielmerencio.org
vhost_docroot: /var/www/guestbook
app_repo: https://github.com/josedom24/guestbook_php.git

paquetes_web:
  - apache2
  - php
  - libapache2-mod-php
  - php-mysql
  - php-mbstring
  - mariadb-client

# Cortafuegos
cortafuegos_plantilla: nftables-web.conf.j2

# HTTPS con certificado autofirmado
cert_dir: /etc/ssl/guestbook
cert_fichero: "{{ cert_dir }}/guestbook.crt"
cert_clave: "{{ cert_dir }}/guestbook.key"
cert_dias: 365
