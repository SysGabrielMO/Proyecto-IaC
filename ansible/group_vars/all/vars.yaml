# Red de datos
ip_datos_web: 10.0.100.10
ip_datos_bd: 10.0.100.20

# Base de datos de la aplicación
# Las contraseñas están cifradas en vault.yaml (Ansible Vault)
bd_nombre: guestbook
bd_usuario: guestbook
bd_password: "{{ vault_bd_password }}"

# Paquetes que se instalan en todas las máquinas
paquetes_comunes:
  - vim
  - curl
  - git
  - htop

# Redes del escenario (cortafuegos)
red_nat_cidr: 192.168.123.0/24
red_datos_cidr: 10.0.100.0/24

# Puertos TCP a los que bd puede salir a través de web (el 53 también por UDP)
puertos_salida_bd:
  - 53
  - 80
  - 443
