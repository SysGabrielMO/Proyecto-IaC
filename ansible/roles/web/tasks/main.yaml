- name: Instalar Apache, PHP y el cliente de MariaDB
  ansible.builtin.apt:
    name: "{{ paquetes_web }}"
    state: present

- name: Descargar la aplicación
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ vhost_docroot }}"
    update: false

- name: Generar config.php con los datos de conexión
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ vhost_docroot }}/config.php"
    owner: root
    group: www-data
    mode: "0640"

- name: Crear el virtual host
  ansible.builtin.template:
    src: guestbook.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    mode: "0644"
  notify: Reiniciar Apache

- name: Activar el módulo rewrite
  ansible.builtin.command: a2enmod rewrite
  args:
    creates: /etc/apache2/mods-enabled/rewrite.load
  notify: Reiniciar Apache

- name: Crear el directorio del certificado
  ansible.builtin.file:
    path: "{{ cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generar el certificado autofirmado y su clave
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048
    -days {{ cert_dias }}
    -keyout {{ cert_clave }}
    -out {{ cert_fichero }}
    -subj "/CN={{ vhost_nombre }}"
    -addext "subjectAltName=DNS:{{ vhost_nombre }}"
  args:
    creates: "{{ cert_fichero }}"
  notify: Reiniciar Apache

- name: Proteger la clave privada del certificado
  ansible.builtin.file:
    path: "{{ cert_clave }}"
    owner: root
    group: root
    mode: "0600"

- name: Activar el módulo SSL
  ansible.builtin.command: a2enmod ssl
  args:
    creates: /etc/apache2/mods-enabled/ssl.load
  notify: Reiniciar Apache

- name: Activar el virtual host
  ansible.builtin.command: a2ensite guestbook
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Reiniciar Apache

- name: Desactivar el sitio por defecto
  ansible.builtin.command: a2dissite 000-default
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Reiniciar Apache

- name: Apache arrancado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
