- name: Instalar LVM
  ansible.builtin.apt:
    name: lvm2
    state: present

- name: Crear el grupo de volúmenes en el disco de datos
  community.general.lvg:
    vg: "{{ vg_datos }}"
    pvs: "{{ disco_datos }}"

- name: Crear el volumen lógico dejando un 20% libre para ampliarlo
  community.general.lvol:
    vg: "{{ vg_datos }}"
    lv: "{{ lv_datos }}"
    size: 80%VG
    shrink: false

- name: Crear el sistema de ficheros del volumen de datos
  community.general.filesystem:
    fstype: ext4
    dev: "/dev/{{ vg_datos }}/{{ lv_datos }}"

- name: Montar el volumen en el directorio de datos de MariaDB
  ansible.posix.mount:
    path: "{{ mysql_datadir }}"
    src: "/dev/{{ vg_datos }}/{{ lv_datos }}"
    fstype: ext4
    state: mounted

- name: Instalar MariaDB y la librería de Python para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Escuchar solo en la red de datos
  ansible.builtin.lineinfile:
    path: "{{ mariadb_config }}"
    regexp: '^bind-address'
    line: "bind-address = {{ ip_datos_bd }}"
  notify: Reiniciar MariaDB

- name: MariaDB arrancado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear el usuario que solo puede conectarse desde el servidor web
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    host: "{{ ip_datos_web }}"
    password: "{{ bd_password }}"
    priv: "{{ bd_nombre }}.*:ALL"
    column_case_sensitive: true
    state: present
    login_unix_socket: "{{ mariadb_socket }}"

- name: Descargar el esquema de la aplicación
  ansible.builtin.get_url:
    url: "{{ schema_url }}"
    dest: "{{ schema_ruta }}"
    mode: "0600"

- name: Comprobar si ya existe la tabla messages
  community.mysql.mysql_query:
    login_db: "{{ bd_nombre }}"
    query: "SHOW TABLES LIKE 'messages'"
    login_unix_socket: "{{ mariadb_socket }}"
  register: tabla_messages
  changed_when: false

- name: Crear las tablas si no existen
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: import
    target: "{{ schema_ruta }}"
    login_unix_socket: "{{ mariadb_socket }}"
  when: tabla_messages.rowcount[0] == 0
