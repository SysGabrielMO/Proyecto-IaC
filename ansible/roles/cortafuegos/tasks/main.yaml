- name: Instalar nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Generar las reglas del cortafuegos
  ansible.builtin.template:
    src: "{{ cortafuegos_plantilla }}"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Recargar el cortafuegos

- name: Cortafuegos arrancado y habilitado
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
